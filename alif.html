<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم ألف</title>
<style>
:root{--bg:#0d1122;--s:#161b33;--s2:#1e2542;--ln:#ffffff24;--tx:#f3f5ff;--mu:#8d96bc;--ac:#5b8cff;--ac2:#9a6bff;--ok:#2ed3a0;--er:#ff5c7a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,Tahoma,sans-serif;padding-bottom:90px}
header{padding:14px 16px;font-size:20px;font-weight:700;color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{white-space:nowrap;background:var(--s);color:var(--mu);border:1px solid var(--ln);border-radius:12px;padding:9px 14px;font:inherit}
nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
main{padding:6px 12px;max-width:760px;margin:auto}
.card,details{background:var(--s);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
details>summary{cursor:pointer;font-weight:700}
label{display:block;color:var(--mu);font-size:13px;margin:8px 0;flex:1}
input,select,textarea{width:100%;margin-top:4px;background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit}
input[type=checkbox],input[type=radio]{width:auto;margin:0 0 0 8px}
.ck{display:flex;align-items:center;color:var(--tx)}
.row{display:flex;gap:8px}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--s2);color:var(--tx);cursor:pointer;margin:4px 0 0 6px}
button.bad{background:#ff5c7a33;color:var(--er)}
button.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
#sv{position:fixed;bottom:16px;left:16px;right:16px;max-width:728px;margin:auto;padding:15px;font-size:17px;font-weight:700;box-shadow:0 6px 24px #0008}
#toast{position:fixed;top:12px;left:12px;right:12px;margin:auto;max-width:500px;padding:12px;border-radius:12px;background:var(--ok);color:#042;font-weight:700;display:none;z-index:9;text-align:center}
.opt{display:flex;align-items:center;gap:6px}.opt input[type=text]{margin:6px 0}
h4{margin:12px 0 4px;color:var(--ac)}p.m{color:var(--mu);line-height:1.7}
textarea.raw{min-height:360px;direction:ltr;font-family:monospace;font-size:13px}
</style></head><body>
<header>لوحة تحكم ألف</header><nav id="nav"></nav><main id="app"></main>
<button id="sv" class="pri" data-a="save">حفظ ونشر</button><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const ST={ok:0,cf:{o:'',r:'alif',b:'main',t:''},config:{},stages:[],notices:[],cd:null,raw:{file:'',text:''},last:-1};
const SHA={};let tab='set',curFile='';
try{Object.assign(ST.cf,JSON.parse(localStorage.getItem('alif_admin')||'{}'))}catch(e){}
if(ST.cf.t&&ST.cf.o)connect();
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.background=bad?'var(--er)':'var(--ok)';t.style.color=bad?'#fff':'#042';t.style.display='block';setTimeout(()=>t.style.display='none',bad?5000:2200)}
const busy=v=>document.body.style.opacity=v?.5:1;
const gp=p=>p.split('.').reduce((o,k)=>o==null?o:o[k],ST);
function sp(p,v){const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],ST)[l]=v}
/* ---- GitHub API ---- */
const api=p=>`https://api.github.com/repos/${ST.cf.o}/${ST.cf.r}/contents/${p.split('/').map(encodeURIComponent).join('/')}`;
const H=()=>({Authorization:'Bearer '+ST.cf.t,Accept:'application/vnd.github+json'});
async function getF(p){const r=await fetch(api(p)+'?ref='+encodeURIComponent(ST.cf.b)+'&t='+Date.now(),{headers:H()});
 if(r.status==404){delete SHA[p];return null}
 const j=await r.json();if(!r.ok)throw new Error(r.status+' '+j.message);SHA[p]=j.sha;
 return new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\s/g,'')),c=>c.charCodeAt(0)))}
async function putF(p,txt){let bin='';new TextEncoder().encode(txt).forEach(b=>bin+=String.fromCharCode(b));
 const body={message:'admin: '+p,content:btoa(bin),branch:ST.cf.b};if(SHA[p])body.sha=SHA[p];
 const r=await fetch(api(p),{method:'PUT',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok)throw new Error(r.status+' '+j.message);SHA[p]=j.content.sha}
const put=(f,o)=>putF(f,JSON.stringify(o,null,2)+'\n');
async function connect(){busy(1);try{
 localStorage.setItem('alif_admin',JSON.stringify(ST.cf));
 const d={config:{app_name:'Alif',latest_version:1,min_version:1,update_url:'',update_notes:'',maintenance:false,maintenance_msg:'',ads_enabled:true,telegram:'',content_version:1},stages:[],notices:[]};
 for(const [k,f] of [['config','config.json'],['stages','stages.json'],['notices','notices.json']]){const t=await getF(f);ST[k]=t?JSON.parse(t):d[k]}
 ST.ok=1;tab='cfg';toast('تم الاتصال');}catch(e){ST.ok=0;toast(e.message,1)}busy(0);render()}
const subjFiles=()=>{const a=[];ST.stages.forEach(s=>(s.subjects||[]).forEach(j=>{const f=j.file||`content/${s.id}/${j.id}.json`;a.push([f,s.name+' - '+j.name])}));return a};
async function openC(f){busy(1);try{const t=await getF(f);ST.cd=t?JSON.parse(t):{};ST.cd.lessons=ST.cd.lessons||[];ST.cd.questions=ST.cd.questions||[];curFile=f;ST.last=-1}catch(e){toast(e.message,1)}busy(0);render()}
/* ---- fields ---- */
const inp=(p,l,t='s',x='')=>`<label>${l}<input data-p="${p}" data-t="${t}" type="${t=='n'?'number':'text'}" value="${esc(gp(p))}" ${x}></label>`;
const area=(p,l,r=2)=>`<label>${l}<textarea data-p="${p}" data-t="s" rows="${r}">${esc(gp(p))}</textarea></label>`;
const chk=(p,l,d=false)=>{const v=gp(p);return `<label class="ck"><input type="checkbox" data-p="${p}" ${(v===undefined?d:v)?'checked':''}>${l}</label>`};
const sel=(p,l,o)=>`<label>${l}<select data-p="${p}" data-t="s">${o.map(x=>`<option value="${esc(x[0])}" ${gp(p)==x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select></label>`;
const fsel=(id,cur)=>`<select id="${id}">${subjFiles().map(x=>`<option value="${esc(x[0])}" ${x[0]==cur?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`;
/* ---- views ---- */
const V={
set:()=>`<div class="card"><p class="m">أنشئ Fine-grained token من GitHub بصلاحية Contents: Read and write لهذا المستودع فقط. لا ترفع هذا الملف على الانترنت لأن الرمز يُحفظ بمتصفحك.</p>
${inp('cf.o','اسم حساب GitHub','s','dir="ltr"')}${inp('cf.r','اسم المستودع','s','dir="ltr"')}${inp('cf.b','الفرع (branch)','s','dir="ltr"')}
<label>الرمز (Token)<input data-p="cf.t" data-t="s" type="password" dir="ltr" value="${esc(ST.cf.t)}"></label>
<button class="pri" data-a="conn">اتصال وتحميل</button><button class="bad" data-a="logout">مسح الرمز</button></div>`,
cfg:()=>`<div class="card"><h4>الصيانة</h4>${chk('config.maintenance','وضع الصيانة (يقفل التطبيق)')}${area('config.maintenance_msg','رسالة الصيانة')}
<h4>التحديثات</h4><div class="row">${inp('config.min_version','أقل نسخة مسموحة (إجباري)','n')}${inp('config.latest_version','آخر نسخة (اختياري)','n')}</div>
${inp('config.update_url','رابط التحديث','s','dir="ltr"')}${area('config.update_notes','ملاحظات التحديث')}
<h4>عام</h4>${inp('config.app_name','اسم التطبيق')}${inp('config.telegram','رابط التلكرام','s','dir="ltr"')}${chk('config.ads_enabled','تفعيل الاعلانات',true)}
${inp('config.content_version','نسخة المحتوى (تزيد تلقائياً عند حفظ المراحل والأسئلة)','n')}</div>`,
stg:()=>ST.stages.map((s,i)=>`<div class="card"><div class="row">${inp(`stages.${i}.id`,'المعرّف (انجليزي)','s','dir="ltr"')}${inp(`stages.${i}.name`,'الاسم')}</div>
<div class="row">${inp(`stages.${i}.order`,'الترتيب','n')}${inp(`stages.${i}.exam_date`,'تاريخ الامتحان','s','dir="ltr" placeholder="2027-06-10"')}</div>${chk(`stages.${i}.visible`,'ظاهرة',true)}
<h4>المواد</h4>${(s.subjects||[]).map((j,k)=>`<details><summary>${esc(j.name||j.id||'مادة')}</summary><div class="row">${inp(`stages.${i}.subjects.${k}.id`,'المعرّف','s','dir="ltr"')}${inp(`stages.${i}.subjects.${k}.name`,'الاسم')}</div>
${inp(`stages.${i}.subjects.${k}.file`,'مسار الملف (اتركه فارغ للتلقائي)','s','dir="ltr"')}<div class="row">${inp(`stages.${i}.subjects.${k}.v`,'النسخة','n')}</div>${chk(`stages.${i}.subjects.${k}.visible`,'ظاهرة',true)}
<button data-a="open" data-f="${esc(j.file||`content/${s.id}/${j.id}.json`)}">تعديل الأسئلة</button><button class="bad" data-a="del" data-p="stages.${i}.subjects.${k}">حذف</button></details>`).join('')}
<button data-a="add" data-k="subj" data-p="stages.${i}.subjects">+ مادة</button><button class="bad" data-a="del" data-p="stages.${i}">حذف المرحلة</button></div>`).join('')+`<button class="pri" data-a="add" data-k="stage" data-p="stages">+ مرحلة جديدة</button>`,
cnt:()=>`<div class="card">${subjFiles().length?fsel('fs',curFile)+'<button class="pri" data-a="load" data-s="fs">تحميل المادة</button>':'<p class="m">أضف مرحلة ومادة أولاً من تبويب المراحل واحفظها.</p>'}</div>`+(ST.cd?`
<h4>الدروس</h4>${ST.cd.lessons.map((l,i)=>`<div class="card"><div class="row">${inp(`cd.lessons.${i}.id`,'المعرّف','s','dir="ltr"')}${inp(`cd.lessons.${i}.title`,'العنوان')}</div>${area(`cd.lessons.${i}.summary`,'الملخص',3)}<button class="bad" data-a="del" data-p="cd.lessons.${i}">حذف</button></div>`).join('')}
<button data-a="add" data-k="les" data-p="cd.lessons">+ درس</button>
<h4>الأسئلة (${ST.cd.questions.length})</h4>${ST.cd.questions.map((q,i)=>`<details ${i==ST.last?'open':''}><summary>${i+1}. ${esc((q.text||'سؤال جديد').slice(0,50))}</summary>
<div class="row">${inp(`cd.questions.${i}.id`,'المعرّف','s','dir="ltr"')}${inp(`cd.questions.${i}.year`,'السنة (0=بدون)','n')}</div>
${sel(`cd.questions.${i}.lesson`,'الدرس',[['','—']].concat(ST.cd.lessons.map(l=>[l.id,l.title||l.id])))}${area(`cd.questions.${i}.text`,'نص السؤال',3)}
<p class="m">الخيارات (حدد الصحيح):</p>${[0,1,2,3].map(k=>`<div class="opt"><input type="radio" name="qa${i}" data-p="cd.questions.${i}.answer" data-t="n" value="${k}" ${q.answer==k?'checked':''}><input type="text" data-p="cd.questions.${i}.options.${k}" data-t="s" value="${esc((q.options||[])[k])}"></div>`).join('')}
${area(`cd.questions.${i}.explain`,'الشرح',2)}<button class="bad" data-a="del" data-p="cd.questions.${i}">حذف السؤال</button></details>`).join('')}
<button class="pri" data-a="add" data-k="q" data-p="cd.questions">+ سؤال</button>`:''),
ntc:()=>ST.notices.map((n,i)=>`<details><summary>${esc(n.title||'اشعار جديد')}</summary>
<div class="row">${inp(`notices.${i}.id`,'المعرّف','s','dir="ltr"')}${sel(`notices.${i}.type`,'النوع',['info','success','warning','error','update','lock','news'].map(x=>[x,x]))}</div>
${inp(`notices.${i}.title`,'العنوان')}${area(`notices.${i}.body`,'النص',3)}
<div class="row">${sel(`notices.${i}.stage`,'المرحلة',[['all','الكل']].concat(ST.stages.map(s=>[s.id,s.name])))}${sel(`notices.${i}.inapp`,'داخل التطبيق',[['banner','شريط'],['popup','نافذة'],['none','بدون']])}</div>
${chk(`notices.${i}.push`,'ارسال كإشعار للهاتف')}${inp(`notices.${i}.url`,'رابط (اختياري)','s','dir="ltr"')}
<div class="row">${inp(`notices.${i}.start`,'يبدأ','s','dir="ltr" placeholder="2026-11-01"')}${inp(`notices.${i}.end`,'ينتهي','s','dir="ltr" placeholder="2026-12-31"')}</div>
<button class="bad" data-a="del" data-p="notices.${i}">حذف</button></details>`).join('')+`<button class="pri" data-a="add" data-k="ntc" data-p="notices">+ اشعار</button>`,
raw:()=>`<div class="card">${fsel('rs',ST.raw.file)}<select id="rs2"><option value="">أو اختر ملف نظام</option><option>config.json</option><option>stages.json</option><option>notices.json</option></select>
<button data-a="rawload">تحميل</button><textarea class="raw" data-p="raw.text" data-t="s">${esc(ST.raw.text)}</textarea></div>`};
const TABS=[['cfg','الإعدادات'],['stg','المراحل والمواد'],['cnt','الأسئلة'],['ntc','الإشعارات'],['raw','JSON خام'],['set','الاتصال']];
function render(){const sy=scrollY;$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
 A.innerHTML=(!ST.ok&&tab!='set')?'<p class="m">اتصل بالمستودع أولاً من تبويب الاتصال.</p>':V[tab]();
 $('#sv').style.display=(ST.ok&&tab!='set')?'':'none';scrollTo(0,sy)}
/* ---- events ---- */
$('#nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;render()}};
A.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;sp(p,t.type=='checkbox'?t.checked:t.dataset.t=='n'?Number(t.value):t.value)});
const mx=a=>a.reduce((m,x)=>Math.max(m,parseInt(String(x.id).replace(/\D/g,''))||0),0)+1;
const NEW={stage:a=>({id:'s'+mx(a),name:'',order:a.length+1,visible:true,exam_date:'',subjects:[]}),
 subj:a=>({id:'sub'+mx(a),name:'',file:'',v:1,visible:true}),les:a=>({id:'l'+mx(a),title:'',summary:''}),
 q:a=>({id:'q'+mx(a),lesson:(ST.cd.lessons[0]||{}).id||'',year:0,text:'',options:['','','',''],answer:0,explain:''}),
 ntc:a=>({id:'n'+mx(a),type:'news',title:'',body:'',stage:'all',inapp:'banner',push:false,url:'',start:new Date().toISOString().slice(0,10),end:''})};
document.body.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,p=b.dataset.p;
 if(a=='add'){const arr=gp(p);arr.push(NEW[b.dataset.k](arr));if(b.dataset.k=='q')ST.last=arr.length-1;render()}
 else if(a=='del'){if(!confirm('تأكيد الحذف؟'))return;const q=p.split('.'),i=q.pop();gp(q.join('.')).splice(i,1);render()}
 else if(a=='conn')connect();
 else if(a=='logout'){ST.cf.t='';ST.ok=0;localStorage.removeItem('alif_admin');render()}
 else if(a=='open'){tab='cnt';openC(b.dataset.f)}
 else if(a=='load')openC($('#'+b.dataset.s).value);
 else if(a=='rawload'){const f=$('#rs2').value||$('#rs').value;busy(1);try{const t=await getF(f);ST.raw={file:f,text:t||'{}'}}catch(x){toast(x.message,1)}busy(0);render()}
 else if(a=='save')save()});
async function save(){busy(1);try{
 const bump=async()=>{ST.config.content_version=(ST.config.content_version||1)+1;await put('config.json',ST.config)};
 if(tab=='cfg')await put('config.json',ST.config);
 else if(tab=='ntc')await put('notices.json',ST.notices);
 else if(tab=='stg'){ST.stages.forEach(s=>(s.subjects||[]).forEach(j=>{if(!j.file)j.file=`content/${s.id}/${j.id}.json`}));await put('stages.json',ST.stages);await bump()}
 else if(tab=='cnt'){if(!ST.cd||!curFile)throw new Error('اختر مادة أولاً');await put(curFile,ST.cd);
  ST.stages.forEach(s=>(s.subjects||[]).forEach(j=>{if((j.file||`content/${s.id}/${j.id}.json`)==curFile){j.file=curFile;j.v=(j.v||1)+1}}));await put('stages.json',ST.stages);await bump()}
 else if(tab=='raw'){if(!ST.raw.file)throw new Error('حمّل ملف أولاً');const o=JSON.parse(ST.raw.text);await put(ST.raw.file,o);
  const m={'config.json':'config','stages.json':'stages','notices.json':'notices'}[ST.raw.file];if(m)ST[m]=o;if(ST.raw.file!='config.json'&&ST.raw.file!='notices.json')await bump()}
 toast('تم الحفظ، التطبيق يلتقطه خلال دقيقة تقريباً')}catch(e){toast(e.message,1)}busy(0);render()}
render();
</script></body></html>
